{% extends 'base.html' %}

{% block title %}Login - FactFlow CRM{% endblock %}

{% block auth_content %}
<div class="auth-container">
  <div class="auth-header">
    <h2>Login to FactFlow CRM</h2>
  </div>
  
  {% if form.errors %}
    <ul class="messages">
      <li class="error">Your username/email and password didn't match. Please try again.</li>
    </ul>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="{{ form.username.id_for_label }}">Email or Username</label>
      <input type="email" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" class="form-control" required autofocus>
    </div>
    <div class="form-group">
      <label for="{{ form.password.id_for_label }}">Password</label>
      <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" class="form-control" required>
    </div>
    <button type="submit" class="btn" style="width: 100%;">Login</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}

{% block content %}
{% endblock %}
