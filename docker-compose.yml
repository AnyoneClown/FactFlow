services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: factflow
      POSTGRES_USER: factflow
      POSTGRES_PASSWORD: factflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factflow -d factflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://factflow:factflow@db:5432/factflow
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
