services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: factflow
      POSTGRES_USER: factflow
      POSTGRES_PASSWORD: factflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factflow -d factflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
