[tool.poetry]
name = "factflow"
version = "0.1.0"
description = "CRM for spreadsheet uploads and yearly fact aggregation."
authors = ["FactFlow Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
django-environ = "^0.11.2"
openpyxl = "^3.1.5"
psycopg = {version = "^3.2.3", extras = ["binary"]}
gunicorn = "^22.0.0"
whitenoise = "^6.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-django = "^4.8.0"
pytest-cov = "^5.0.0"
ruff = "^0.5.6"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
